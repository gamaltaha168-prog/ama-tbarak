<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <style>
         :root { --bg-body: #f4f7f6; --bg-container: #ffffff; --text-main: #333; --text-title: #2c3e50; --border-color: #eee; --bg-quran: #fafafa; --bg-ayah-hidden: #ddd; --text-ayah-hidden: #ddd; --text-ayah-shown: #2c3e50; --bg-display: #fef9e7; --border-display: #fdebd0; }
        [data-theme="dark"] { --bg-body: #121212; --bg-container: #1e1e1e; --text-main: #e0e0e0; --text-title: #fff; --border-color: #333; --bg-quran: #252525; --bg-ayah-hidden: #444; --text-ayah-hidden: #444; --text-ayah-shown: #e0e0e0; --bg-display: #2c2519; --border-display: #4a3b2c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; text-align: center; transition: background 0.3s, color 0.3s; }
        .container { max-width: 850px; margin: 0 auto; background: var(--bg-container); padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        h1 { color: var(--text-title); font-size: 24px; margin-bottom: 5px; }
        h2 {color:cyan;background-color:rgb(230, 39, 39);}
        .theme-toggle-btn { position: absolute; top: 20px; left: 20px; background: #16a085; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 16px; font-family: inherit; }
        .selector-box, .bottom-nav-box { margin: 20px 0; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        .bottom-nav-box { margin-top: 30px; padding-top: 20px; border-top: 2px dashed var(--border-color); }
        select { font-size: 18px; padding: 10px 15px; border-radius: 5px; border: 2px solid #16a085; background-color: var(--bg-container); color: var(--text-main); cursor: pointer; width: 230px; }
        .instructions { background-color: #e8f8f5; color: #16a085; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 25px; }
        [data-theme="dark"] .instructions { background-color: #112d28; color: #1abc9c; }
        .quran-text { font-size: 26px; line-height: 2.3; text-align: justify; direction: rtl; word-spacing: 4px; padding: 20px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-quran); min-height: 120px; }
        .ayah { cursor: pointer; background-color: var(--bg-ayah-hidden); color: var(--text-ayah-hidden); padding: 2px 6px; border-radius: 4px; transition: all 0.2s ease; user-select: none; display: inline; }
        .ayah.revealed { background-color: transparent; color: var(--text-ayah-shown); }
        .ayah-number { font-size: 18px; color: #e67e22; font-weight: bold; margin: 0 6px; user-select: none; }
        .basmala { display: block; text-align: center; font-size: 30px; color: #16a085; margin-bottom: 20px; }
        .control-buttons { margin-top: 25px; margin-bottom: 15px; }
        .btn { background-color: #2980b9; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; font-family: inherit; }
        .btn-reset { background-color: #e74c3c; }
        .current-surah-display { font-size: 20px; font-weight: bold; color: #d35400; background-color: var(--bg-display); border: 1px solid var(--border-display); padding: 8px 20px; border-radius: 30px; min-width: 150px; }
        .btn-nav { background-color: #16a085; font-weight: bold; min-width: 140px; transition: all 0.3s; }
        .btn-nav:disabled { background-color: #bdc3c7; color: #7f8c8d; cursor: not-allowed; }
        [data-theme="dark"] .btn-nav:disabled { background-color: #333; color: #555; }
         
        
        
    </style>
</head>
<body>

    <script>
        const quranDatabase = {
             "الملك": [
                            
               " تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ","الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا ۖ مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَـٰنِ مِن تَفَاوُتٍ ۖ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ","ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ","وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ","وَلِلَّذِينَ كَفَرُوا بِرَبِّهِمْ عَذَابُ جَهَنَّمَ ۖ وَبِئْسَ الْمَصِيرُ","إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا وَهِيَ تَفُورُ","تَكَادُ تَمَيَّزُ مِنَ الْغَيْظِ ۖ كُلَّمَا أُلْقِيَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ نَذِيرٌ","قَالُوا بَلَىٰ قَدْ جَاءَنَا نَذِيرٌ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ اللَّهُ مِن شَيْءٍ إِنْ أَنتُمْ إِلَّا فِي ضَلَالٍ كَبِيرٍ","وَقَالُوا لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِي أَصْحَابِ السَّعِيرِ","فَاعْتَرَفُوا بِذَنبِهِمْ فَسُحْقًا لِّأَصْحَابِ السَّعِيرِ","إِنَّ الَّذِينَ يَخْشَوْنَ رَبَّهُم بِالْغَيْبِ لَهُم مَّغْفِرَةٌ وَأَجْرٌ كَبِيرٌ","وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ ۖ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ","أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ","هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِن رِّزْقِهِ ۖ وَإِلَيْهِ النُّشُورُ","أَأَمِنتُم مَّن فِي السَّمَاءِ أَن يَخْسِفَ بِكُمُ الْأَرْضَ فَإِذَا هِيَ تَمُورُ","أَمْ أَمِنتُم مَّن فِي السَّمَاءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًا ۖ فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ","وَلَقَدْ كَذَّبَ الَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ","أَوَلَمْ يَرَوْا إِلَى الطَّيْرِ فَوْقَهُمْ صَافَّاتٍ وَيَقْبِضْنَ ۚ مَا يُمْسِكُهُنَّ إِلَّا الرَّحْمَـٰنُ ۚ إِنَّهُ بِكُلِّ شَيْءٍ بَصِيرٌ","أَمَّنْ هَـٰذَا الَّذِي هُوَ جُندٌ لَّكُمْ يَنصُرُكُم مِّن دُونِ الرَّحْمَـٰنِ ۚ إِنِ الْكَافِرُونَ إِلَّا فِي غُرُورٍ","أَمَّنْ هَـٰذَا الَّذِي يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُ ۚ بَل لَّجُّوا فِي عُتُوٍّ وَنُفُورٍ","أَفَمَن يَمْشِي مُكِبًّا عَلَىٰ وَجْهِهِ أَهْدَىٰ أَمَّن يَمْشِي سَوِيًّا عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ","قُلْ هُوَ الَّذِي أَنشَأَكُمْ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ ۖ قَلِيلًا مَّا تَشْكُرُونَ","قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ","وَيَقُولُونَ مَتَىٰ هَـٰذَا الْوَعْدُ إِن كُنتُمْ صَادِقِينَ","قُلْ إِنَّمَا الْعِلْمُ عِندَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُّبِينٌ","فَلَمَّا رَأَوْهُ زُلْفَةً سِيئَتْ وُجُوهُ الَّذِينَ كَفَرُوا وَقِيلَ هَـٰذَا الَّذِي كُنتُم بِهِ تَدَّعُونَ","قُلْ أَرَأَيْتُمْ إِنْ أَهْلَكَنِيَ اللَّهُ وَمَن مَّعِيَ أَوْ رَحِمَنَا فَمَن يُجِيرُ الْكَافِرِينَ مِنْ عَذَابٍ أَلِيمٍ","قُلْ هُوَ الرَّحْمَـٰنُ آمَنَّا بِهِ وَعَلَيْهِ تَوَكَّلْنَا ۖ فَسَتَعْلَمُونَ مَنْ هُوَ فِي ضَلَالٍ مُّبِينٍ","قُلْ أَرَأَيْتُمْ إِنْ أَصْبَحَ مَاؤُكُمْ غَوْرًا فَمَن يَأْتِيكُم بِمَاءٍ مَّعِينٍ"
            ],
               "القلم": [
          " ن ۚوَالْقَلَمِ وَمَا يَسْطُرُونَ","مَا أَنتَ بِنِعْمَةِ رَبِّكَ بِمَجْنُونٍ","وَإِنَّ لَكَ لَأَجْرًا غَيْرَ مَمْنُونٍ","وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ","فَسَتُبْصِرُ وَيُبْصِرُونَ","بِأَييِّكُمُ الْمَفْتُونُ","إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ","فَلَا تُطِعِ الْمُكَذِّبِينَ","وَدُّوا لَوْ تُدْهِنُ فَيُدْهِنُونَ","وَلَا تُطِعْ كُلَّ حَلَّافٍ مَّهِينٍ","هَمَّازٍ مَّشَّاءٍ بِنَمِيمٍ","مَّنَّاعٍ لِّلْخَيْرِ مُعْتَدٍ أَثِيمٍ","عُتُلٍّ بَعْدَ ذَٰلِكَ زَنِيمٍ","أَن كَانَ ذَا مَالٍ وَبَنِينَ","إِذَا تُتْلَىٰ عَلَيْهِ آيَاتُنَا قَالَ أَسَاطِيرُ الْأَوَّلِينَ","سَنَسِمُهُ عَلَى الْخُرْطُومِ","إِنَّا بَلَوْنَاهُمْ كَمَا بَلَوْنَا أَصْحَابَ الْجَنَّةِ إِذْ أَقْسَمُوا لَيَصْرِمُنَّهَا مُصْبِحِينَ","وَلَا يَسْتَثْنُونَ","فَطَافَ عَلَيْهَا طَائِفٌ مِّن رَّبِّكَ وَهُمْ نَائِمُونَ","فَأَصْبَحَتْ كَالصَّرِيمِ","فَتَنَادَوْا مُصْبِحِينَ","أَنِ اغْدُوا عَلَىٰ حَرْثِكُمْ إِن كُنتُمْ صَارِمِينَ","فَانطَلَقُوا وَهُمْ يَتَخَافَتُونَ","أَن لَّا يَدْخُلَنَّهَا الْيَوْمَ عَلَيْكُم مِّسْكِينٌ","وَغَدَوْا عَلَىٰ حَرْدٍ قَادِرِينَ","فَلَمَّا رَأَوْهَا قَالُوا إِنَّا لَضَالُّونَ","بَلْ نَحْنُ مَحْرُومُونَ","قَالَ أَوْسَطُهُمْ أَلَمْ أَقُل لَّكُمْ لَوْلَا تُسَبِّحُونَ","قَالُوا سُبْحَانَ رَبِّنَا إِنَّا كُنَّا ظَالِمِينَ","فَأَقْبَلَ بَعْضُهُمْ عَلَىٰ بَعْضٍ يَتَلَاوَمُونَ","قَالُوا يَا وَيْلَنَا إِنَّا كُنَّا طَاغِينَ","عَسَىٰ رَبُّنَا أَن يُبْدِلَنَا خَيْرًا مِّنْهَا إِنَّا إِلَىٰ رَبِّنَا رَاغِبُونَ","كَذَٰلِكَ الْعَذَابُ ۖ وَلَعَذَابُ الْآخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا يَعْلَمُونَ","إِنَّ لِلْمُتَّقِينَ عِندَ رَبِّهِمْ جَنَّاتِ النَّعِيمِ","أَفَنَجْعَلُ الْمُسْلِمِينَ كَالْمُجْرِمِينَ","مَا لَكُمْ كَيْفَ تَحْكُمُونَ","أَمْ لَكُمْ كِتَابٌ فِيهِ تَدْرُسُونَ","إِنَّ لَكُمْ فِيهِ لَمَا تَخَيَّرُونَ","أَمْ لَكُمْ أَيْمَانٌ عَلَيْنَا بَالِغَةٌ إِلَىٰ يَوْمِ الْقِيَامَةِ ۙ إِنَّ لَكُمْ لَمَا تَحْكُمُونَ","سَلْهُمْ أَيُّهُم بِذَٰلِكَ زَعِيمٌ","أَمْ لَهُمْ شُرَكَاءُ فَلْيَأْتُوا بِشُرَكَائِهِمْ إِن كَانُوا صَادِقِينَ","يَوْمَ يُكْشَفُ عَن سَاقٍ وَيُدْعَوْنَ إِلَى السُّجُودِ فَلَا يَسْتَطِيعُونَ","خَاشِعَةً أَبْصَارُهُمْ تَرْهَقُهُمْ ذِلَّةٌ ۖ وَقَدْ كَانُوا يُدْعَوْنَ إِلَى السُّجُودِ وَهُمْ سَالِمُونَ","فَذَرْنِي وَمَن يُكَذِّبُ بِهَـٰذَا الْحَدِيثِ ۖ سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ","وَأُمْلِي لَهُمْ ۚ إِنَّ كَيْدِي مَتِينٌ","أَمْ تَسْأَلُهُمْ أَجْرًا فَهُم مِّن مَّغْرَمٍ مُّثْقَلُونَ","أَمْ عِندَهُمُ الْغَيْبُ فَهُمْ يَكْتُبُونَ","فَاصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تَكُن كَصَاحِبِ الْحُوتِ إِذْ نَادَىٰ وَهُوَ مَكْظُومٌ","لَّوْلَا أَن تَدَارَكَهُ نِعْمَةٌ مِّن رَّبِّهِ لَنُبِذَ بِالْعَرَاءِ وَهُوَ مَذْمُومٌ","فَاجْتَبَاهُ رَبُّهُ فَجَعَلَهُ مِنَ الصَّالِحِينَ","وَإِن يَكَادُ الَّذِينَ كَفَرُوا لَيُزْلِقُونَكَ بِأَبْصَارِهِمْ لَمَّا سَمِعُوا الذِّكْرَ وَيَقُولُونَ إِنَّهُ لَمَجْنُونٌ","وَمَا هُوَ إِلَّا ذِكْرٌ لِّلْعَالَمِينَ  "
          ],
              "الحاقة": [ 
         " الْحَاقَّةُ","مَا الْحَاقَّةُ","وَمَا أَدْرَاكَ مَا الْحَاقَّةُ","كَذَّبَتْ ثَمُودُ وَعَادٌ بِالْقَارِعَةِ","فَأَمَّا ثَمُودُ فَأُهْلِكُوا بِالطَّاغِيَةِ","وَأَمَّا عَادٌ فَأُهْلِكُوا بِرِيحٍ صَرْصَرٍ عَاتِيَةٍ","سَخَّرَهَا عَلَيْهِمْ سَبْعَ لَيَالٍ وَثَمَانِيَةَ أَيَّامٍ حُسُومًا فَتَرَى الْقَوْمَ فِيهَا صَرْعَىٰ كَأَنَّهُمْ أَعْجَازُ نَخْلٍ خَاوِيَةٍ","فَهَلْ تَرَىٰ لَهُم مِّن بَاقِيَةٍ","وَجَاءَ فِرْعَوْنُ وَمَن قَبْلَهُ وَالْمُؤْتَفِكَاتُ بِالْخَاطِئَةِ","فَعَصَوْا رَسُولَ رَبِّهِمْ فَأَخَذَهُمْ أَخْذَةً رَّابِيَةً","إِنَّا لَمَّا طَغَى الْمَاءُ حَمَلْنَاكُمْ فِي الْجَارِيَةِ","لِنَجْعَلَهَا لَكُمْ تَذْكِرَةً وَتَعِيَهَا أُذُنٌ وَاعِيَةٌ","فَإِذَا نُفِخَ فِي الصُّورِ نَفْخَةٌ وَاحِدَةٌ","وَحُمِلَتِ الْأَرْضُ وَالْجِبَالُ فَدُكَّتَا دَكَّةً وَاحِدَةً","فَيَوْمَئِذٍ وَقَعَتِ الْوَاقِعَةُ","وَانشَقَّتِ السَّمَاءُ فَهِيَ يَوْمَئِذٍ وَاهِيَةٌ","وَالْمَلَكُ عَلَىٰ أَرْجَائِهَا ۚ وَيَحْمِلُ عَرْشَ رَبِّكَ فَوْقَهُمْ يَوْمَئِذٍ ثَمَانِيَةٌ","يَوْمَئِذٍ تُعْرَضُونَ لَا تَخْفَىٰ مِنكُمْ خَافِيَةٌ","فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ فَيَقُولُ هَاؤُمُ اقْرَءُوا كِتَابِيَهْ","إِنِّي ظَنَنتُ أَنِّي مُلَاقٍ حِسَابِيَهْ","فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ","فِي جَنَّةٍ عَالِيَةٍ","قُطُوفُهَا دَانِيَةٌ","كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا أَسْلَفْتُمْ فِي الْأَيَّامِ الْخَالِيَةِ","وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِشِمَالِهِ فَيَقُولُ يَا لَيْتَنِي لَمْ أُوتَ كِتَابِيَهْ","وَلَمْ أَدْرِ مَا حِسَابِيَهْ","يَا لَيْتَهَا كَانَتِ الْقَاضِيَةَ","مَا أَغْنَىٰ عَنِّي مَالِيَهْ ۜ","هَلَكَ عَنِّي سُلْطَانِيَهْ","خُذُوهُ فَغُلُّوهُ","ثُمَّ الْجَحِيمَ صَلُّوهُ","ثُمَّ فِي سِلْسِلَةٍ ذَرْعُهَا سَبْعُونَ ذِرَاعًا فَاسْلُكُوهُ","إِنَّهُ كَانَ لَا يُؤْمِنُ بِاللَّهِ الْعَظِيمِ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ","فَلَيْسَ لَهُ الْيَوْمَ هَاهُنَا حَمِيمٌ","وَلَا طَعَامٌ إِلَّا مِنْ غِسْلِينٍ","لَّا يَأْكُلُهُ إِلَّا الْخَاطِئُونَ","فَلَا أُقْسِمُ بِمَا تُبْصِرُونَ","وَمَا لَا تُبْصِرُونَ","إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ","وَمَا هُوَ بِقَوْلِ شَاعِرٍ ۚ قَلِيلًا مَّا تُؤْمِنُونَ","وَلَا بِقَوْلِ كَاهِنٍ ۚ قَلِيلًا مَّا تَذَكَّرُونَ","تَنزِيلٌ مِّن رَّبِّ الْعَالَمِينَ","وَلَوْ تَقَوَّلَ عَلَيْنَا بَعْضَ الْأَقَاوِيلِ","لَأَخَذْنَا مِنْهُ بِالْيَمِينِ","ثُمَّ لَقَطَعْنَا مِنْهُ الْوَتِينَ","فَمَا مِنكُم مِّنْ أَحَدٍ عَنْهُ حَاجِزِينَ","وَإِنَّهُ لَتَذْكِرَةٌ لِّلْمُتَّقِينَ","وَإِنَّا لَنَعْلَمُ أَنَّ مِنكُم مُّكَذِّبِينَ","وَإِنَّهُ لَحَسْرَةٌ عَلَى الْكَافِرِينَ","وَإِنَّهُ لَحَقُّ الْيَقِينِ","فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ"
              ],
             "المعارج": [ 
          
                 " سَأَلَ سَائِلٌ بِعَذَابٍ وَاقِعٍ","لِّلْكَافِرِينَ لَيْسَ لَهُ دَافِعٌ","مِّنَ اللَّهِ ذِي الْمَعَارِجِ","تَعْرُجُ الْمَلَائِكَةُ وَالرُّوحُ إِلَيْهِ فِي يَوْمٍ كَانَ مِقْدَارُهُ خَمْسِينَ أَلْفَ سَنَةٍ","فَاصْبِرْ صَبْرًا جَمِيلًا","إِنَّهُمْ يَرَوْنَهُ بَعِيدًا","وَنَرَاهُ قَرِيبًا","يَوْمَ تَكُونُ السَّمَاءُ كَالْمُهْلِ","وَتَكُونُ الْجِبَالُ كَالْعِهْنِ","وَلَا يَسْأَلُ حَمِيمٌ حَمِيمًا","يُبَصَّرُونَهُمْ ۚ يَوَدُّ الْمُجْرِمُ لَوْ يَفْتَدِي مِنْ عَذَابِ يَوْمِئِذٍ بِبَنِيهِ","وَصَاحِبَتِهِ وَأَخِيهِ","وَفَصِيلَتِهِ الَّتِي تُؤْوِيهِ","وَمَن فِي الْأَرْضِ جَمِيعًا ثُمَّ يُنجِيهِ","كَلَّا ۖ إِنَّهَا لَظَىٰ","نَزَّاعَةً لِّلشَّوَىٰ","تَدْعُو مَنْ أَدْبَرَ وَتَوَلَّىٰ","وَجَمَعَ فَأَوْعَىٰ","إِنَّ الْإِنسَانَ خُلِقَ هَلُوعًا","إِذَا مَسَّهُ الشَّرُّ جَزُوعًا","وَإِذَا مَسَّهُ الْخَيْرُ مَنُوعًا","إِلَّا الْمُصَلِّينَ","الَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ دَائِمُونَ","وَالَّذِينَ فِي أَمْوَالِهِمْ حَقٌّ مَّعْلُومٌ","لِّلسَّائِلِ وَالْمَحْرُومِ","وَالَّذِينَ يُصَدِّقُونَ بِيَوْمِ الدِّينِ","وَالَّذِينَ هُم مِّنْ عَذَابِ رَبِّهِم مُّشْفِقُونَ","إِنَّ عَذَابَ رَبِّهِمْ غَيْرُ مَأْمُونٍ","وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ","إِلَّا عَلَىٰ أَزْوَاجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَانُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ","فَمَنِ ابْتَغَىٰ وَرَاءَ ذَٰلِكَ فَأُولَـٰئِكَ هُمُ الْعَادُونَ","وَالَّذِينَ هُمْ لِأَمَانَاتِهِمْ وَعَهْدِهِمْ رَاعُونَ","وَالَّذِينَ هُم بِشَهَادَاتِهِمْ قَائِمُونَ","وَالَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ يُحَافِظُونَ","أُولَـٰئِكَ فِي جَنَّاتٍ مُّكْرَمُونَ","فَمَالِ الَّذِينَ كَفَرُوا قِبَلَكَ مُهْطِعِينَ","عَنِ الْيَمِينِ وَعَنِ الشِّمَالِ عِزِينَ","أَيَطْمَعُ كُلُّ امْرِئٍ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍ","كَلَّا ۖ إِنَّا خَلَقْنَاهُم مِّمَّا يَعْلَمُونَ","فَلَا أُقْسِمُ بِرَبِّ الْمَشَارِقِ وَالْمَغَارِبِ إِنَّا لَقَادِرُونَ","عَلَىٰ أَن نُّبَدِّلَ خَيْرًا مِّنْهُمْ وَمَا نَحْنُ بِمَسْبُوقِينَ","فَذَرْهُمْ يَخُوضُوا وَيَلْعَبُوا حَتَّىٰ يُلَاقُوا يَوْمَهُمُ الَّذِي يُوعَدُونَ","يَوْمَ يَخْرُجُونَ مِنَ الْأَجْدَاثِ سِرَاعًا كَأَنَّهُمْ إِلَىٰ نُصُبٍ يُوفِضُونَ","خَاشِعَةً أَبْصَارُهُمْ تَرْهَقُهُمْ ذِلَّةٌ ۚ ذَٰلِكَ الْيَوْمُ الَّذِي كَانُوا يُوعَدُونَ "
                   ],
           
             "نوح": [
               "إِنَّا أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ أَنْ أَنذِرْ قَوْمَكَ مِن قَبْلِ أَن يَأْتِيَهُمْ عَذَابٌ أَلِيمٌ","قَالَ يَا قَوْمِ إِنِّي لَكُمْ نَذِيرٌ مُّبِينٌ","أَنِ اعْبُدُوا اللَّهَ وَاتَّقُوهُ وَأَطِيعُونِ","يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُؤَخِّرْكُمْ إِلَىٰ أَجَلٍ مُّسَمًّى ۚ إِنَّ أَجَلَ اللَّهِ إِذَا جَاءَ لَا يُؤَخَّرُ ۖ لَوْ كُنتُمْ تَعْلَمُونَ","قَالَ رَبِّ إِنِّي دَعَوْتُ قَوْمِي لَيْلًا وَنَهَارًا","فَلَمْ يَزِدْهُمْ دُعَائِي إِلَّا فِرَارًا","وَإِنِّي كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوا أَصَابِعَهُمْ فِي آذَانِهِمْ وَاسْتَغْشَوْا ثِيَابَهُمْ وَأَصَرُّوا وَاسْتَكْبَرُوا اسْتِكْبَارًا","ثُمَّ إِنِّي دَعَوْتُهُمْ جِهَارًا","ثُمَّ إِنِّي أَعْلَنتُ لَهُمْ وَأَسْرَرْتُ لَهُمْ إِسْرَارًا","فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا","يُرْسِلِ السَّمَاءَ عَلَيْكُم مِّدْرَارًا","وَيُمْدِدْكُم بِأَمْوَالٍ وَبَنِينَ وَيَجْعَل لَّكُمْ جَنَّاتٍ وَيَجْعَل لَّكُمْ أَنْهَارًا","مَّا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًا","وَقَدْ خَلَقَكُمْ أَطْوَارًاط","أَلَمْ تَرَوْا كَيْفَ خَلَقَ اللَّهُ سَبْعَ سَمَاوَاتٍ طِبَاقًا","وَجَعَلَ الْقَمَرَ فِيهِنَّ نُورًا وَجَعَلَ الشَّمْسَ سِرَاجًاط","وَاللَّهُ أَنبَتَكُم مِّنَ الْأَرْضِ نَبَاتًاط","ثُمَّ يُعِيدُكُمْ فِيهَا وَيُخْرِجُكُمْ إِخْرَاجًا","وَاللَّهُ جَعَلَ لَكُمُ الْأَرْضَ بِسَاطًا","لِّتَسْلُكُوا مِنْهَا سُبُلًا فِجَاجًا","قَالَ نُوحٌ رَّبِّ إِنَّهُمْ عَصَوْنِي وَاتَّبَعُوا مَن لَّمْ يَزِدْهُ مَالُهُ وَوَلَدُهُ إِلَّا خَسَارًا","وَمَكَرُوا مَكْرًا كُبَّارًا","وَقَالُوا لَا تَذَرُنَّ آلِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّا وَلَا سُوَاعًا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًا","وَقَدْ أَضَلُّوا كَثِيرًا ۖ وَلَا تَزِدِ الظَّالِمِينَ إِلَّا ضَلَالًا","مِّمَّا خَطِيئَاتِهِمْ أُغْرِقُوا فَأُدْخِلُوا نَارًا فَلَمْ يَجِدُوا لَهُم مِّن دُونِ اللَّهِ أَنصَارًا","وَقَالَ نُوحٌ رَّبِّ لَا تَذَرْ عَلَى الْأَرْضِ مِنَ الْكَافِرِينَ دَيَّارًا","إِنَّكَ إِن تَذَرْهُمْ يُضِلُّوا عِبَادَكَ وَلَا يَلِدُوا إِلَّا فَاجِرًا كَفَّارًا","رَّبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَلَا تَزِدِ الظَّالِمِينَ إِلَّا تَبَارًا"
             ],
             "الجن": [
                "قُلْ أُوحِيَ إِلَيَّ أَنَّهُ اسْتَمَعَ نَفَرٌ مِّنَ الْجِنِّ فَقَالُوا إِنَّا سَمِعْنَا قُرْآنًا عَجَبًا","يَهْدِي إِلَى الرُّشْدِ فَآمَنَّا بِهِ ۖ وَلَن نُّشْرِكَ بِرَبِّنَا أَحَدًا","وَأَنَّهُ تَعَالَىٰ جَدُّ رَبِّنَا مَا اتَّخَذَ صَاحِبَةً وَلَا وَلَدًا","وَأَنَّهُ كَانَ يَقُولُ سَفِيهُنَا عَلَى اللَّهِ شَطَطًا","وَأَنَّا ظَنَنَّا أَن لَّن تَقُولَ الْإِنسُ وَالْجِنُّ عَلَى اللَّهِ كَذِبًا","وَأَنَّهُ كَانَ رِجَالٌ مِّنَ الْإِنسِ يَعُوذُونَ بِرِجَالٍ مِّنَ الْجِنِّ فَزَادُوهُمْ رَهَقًا","وَأَنَّهُمْ ظَنُّوا كَمَا ظَنَنتُمْ أَن لَّن يَبْعَثَ اللَّهُ أَحَدًا","وَأَنَّا لَمَسْنَا السَّمَاءَ فَوَجَدْنَاهَا مُلِئَتْ حَرَسًا شَدِيدًا وَشُهُبًا","وَأَنَّا كُنَّا نَقْعُدُ مِنْهَا مَقَاعِدَ لِلسَّمْعِ ۖ فَمَن يَسْتَمِعِ الْآنَ يَجِدْ لَهُ شِهَابًا رَّصَدًا","وَأَنَّا لَا نَدْرِي أَشَرٌّ أُرِيدَ بِمَن فِي الْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًا","وَأَنَّا مِنَّا الصَّالِحُونَ وَمِنَّا دُونَ ذَٰلِكَ ۖ كُنَّا طَرَائِقَ قِدَدًا","وَأَنَّا ظَنَنَّا أَن لَّن نُّعْجِزَ اللَّهَ فِي الْأَرْضِ وَلَن نُّعْجِزَهُ هَرَبًا","وَأَنَّا لَمَّا سَمِعْنَا الْهُدَىٰ آمَنَّا بِهِ ۖ فَمَن يُؤْمِن بِرَبِّهِ فَلَا يَخَافُ بَخْسًا وَلَا رَهَقًا","وَأَنَّا مِنَّا الْمُسْلِمُونَ وَمِنَّا الْقَاسِطُونَ ۖ فَمَنْ أَسْلَمَ فَأُولَـٰئِكَ تَحَرَّوْا رَشَدًا","وَأَمَّا الْقَاسِطُونَ فَكَانُوا لِجَهَنَّمَ حَطَبًا","وَأَن لَّوِ اسْتَقَامُوا عَلَى الطَّرِيقَةِ لَأَسْقَيْنَاهُم مَّاءً غَدَقًا","لِّنَفْتِنَهُمْ فِيهِ ۚ وَمَن يُعْرِضْ عَن ذِكْرِ رَبِّهِ يَسْلُكْهُ عَذَابًا صَعَدًا","وَأَنَّ الْمَسَاجِدَ لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا","وَأَنَّهُ لَمَّا قَامَ عَبْدُ اللَّهِ يَدْعُوهُ كَادُوا يَكُونُونَ عَلَيْهِ لِبَدًا","قُلْ إِنَّمَا أَدْعُو رَبِّي وَلَا أُشْرِكُ بِهِ أَحَدًا","قُلْ إِنِّي لَا أَمْلِكُ لَكُمْ ضَرًّا وَلَا رَشَدًا","قُلْ إِنِّي لَن يُجِيرَنِي مِنَ اللَّهِ أَحَدٌ وَلَنْ أَجِدَ مِن دُونِهِ مُلْتَحَدًا","إِلَّا بَلَاغًا مِّنَ اللَّهِ وَرِسَالَاتِهِ ۚ وَمَن يَعْصِ اللَّهَ وَرَسُولَهُ فَإِنَّ لَهُ نَارَ جَهَنَّمَ خَالِدِينَ فِيهَا أَبَدًا","حَتَّىٰ إِذَا رَأَوْا مَا يُوعَدُونَ فَسَيَعْلَمُونَ مَنْ أَضْعَفُ نَاصِرًا وَأَقَلُّ عَدَدًا","قُلْ إِنْ أَدْرِي أَقَرِيبٌ مَّا تُوعَدُونَ أَمْ يَجْعَلُ لَهُ رَبِّي أَمَدًا","عَالِمُ الْغَيْبِ فَلَا يُظْهِرُ عَلَىٰ غَيْبِهِ أَحَدًا","إِلَّا مَنِ ارْتَضَىٰ مِن رَّسُولٍ فَإِنَّهُ يَسْلُكُ مِن بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِ رَصَدًا","لِّيَعْلَمَ أَن قَدْ أَبْلَغُوا رِسَالَاتِ رَبِّهِمْ وَأَحَاطَ بِمَا لَدَيْهِمْ وَأَحْصَىٰ كُلَّ شَيْءٍ عَدَدًا"
             ],
           
               "المزمل": [
                  " يَا أَيُّهَا الْمُزَّمِّلُ","قُمِ اللَّيْلَ إِلَّا قَلِيلًا","نِّصْفَهُ أَوِ انقُصْ مِنْهُ قَلِيلًا","أَوْ زِدْ عَلَيْهِ وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا","إِنَّا سَنُلْقِي عَلَيْكَ قَوْلًا ثَقِيلًا","إِنَّ نَاشِئَةَ اللَّيْلِ هِيَ أَشَدُّ وَطْئًا وَأَقْوَمُ قِيلًا","إِنَّ لَكَ فِي النَّهَارِ سَبْحًا طَوِيلًا","وَاذْكُرِ اسْمَ رَبِّكَ وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًا","رَّبُّ الْمَشْرِقِ وَالْمَغْرِبِ لَا إِلَـٰهَ إِلَّا هُوَ فَاتَّخِذْهُ وَكِيلًا","وَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَاهْجُرْهُمْ هَجْرًا جَمِيلًا","وَذَرْنِي وَالْمُكَذِّبِينَ أُولِي النَّعْمَةِ وَمَهِّلْهُمْ قَلِيلًا","إِنَّ لَدَيْنَا أَنكَالًا وَجَحِيمًا","وَطَعَامًا ذَا غُصَّةٍ وَعَذَابًا أَلِيمًا","يَوْمَ تَرْجُفُ الْأَرْضُ وَالْجِبَالُ وَكَانَتِ الْجِبَالُ كَثِيبًا مَّهِيلًا","إِنَّا أَرْسَلْنَا إِلَيْكُمْ رَسُولًا شَاهِدًا عَلَيْكُمْ كَمَا أَرْسَلْنَا إِلَىٰ فِرْعَوْنَ رَسُولًا","فَعَصَىٰ فِرْعَوْنُ الرَّسُولَ فَأَخَذْنَاهُ أَخْذًا وَبِيلًا","فَكَيْفَ تَتَّقُونَ إِن كَفَرْتُمْ يَوْمًا يَجْعَلُ الْوِلْدَانَ شِيبًا","السَّمَاءُ مُنفَطِرٌ بِهِ ۚ كَانَ وَعْدُهُ مَفْعُولًا","إِنَّ هَـٰذِهِ تَذْكِرَةٌ ۖ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ سَبِيلًا","إِنَّ رَبَّكَ يَعْلَمُ أَنَّكَ تَقُومُ أَدْنَىٰ مِن ثُلُثَيِ اللَّيْلِ وَنِصْفَهُ وَثُلُثَهُ وَطَائِفَةٌ مِّنَ الَّذِينَ مَعَكَ ۚ وَاللَّهُ يُقَدِّرُ اللَّيْلَ وَالنَّهَارَ ۚ عَلِمَ أَن لَّن تُحْصُوهُ فَتَابَ عَلَيْكُمْ ۖ فَاقْرَءُوا مَا تَيَسَّرَ مِنَ الْقُرْآنِ ۚ عَلِمَ أَن سَيَكُونُ مِنكُم مَّرْضَىٰ ۙ وَآخَرُونَ يَضْرِبُونَ فِي الْأَرْضِ يَبْتَغُونَ مِن فَضْلِ اللَّهِ ۙ وَآخَرُونَ يُقَاتِلُونَ فِي سَبِيلِ اللَّهِ ۖ فَاقْرَءُوا مَا تَيَسَّرَ مِنْهُ ۚ وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَأَقْرِضُوا اللَّهَ قَرْضًا حَسَنًا ۚ وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ اللَّهِ هُوَ خَيْرًا وَأَعْظَمَ أَجْرًا ۚ وَاسْتَغْفِرُوا اللَّهَ ۖ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ"
 
               ],
           
                "المدثر": [
       
           " يَا أَيُّهَا الْمُدَّثِّرُ","قُمْ فَأَنذِرْ","وَرَبَّكَ فَكَبِّرْ","وَثِيَابَكَ فَطَهِّرْ","وَالرُّجْزَ فَاهْجُرْ","وَلَا تَمْنُن تَسْتَكْثِرُ","وَلِرَبِّكَ فَاصْبِرْ","فَإِذَا نُقِرَ فِي النَّاقُورِ","فَذَٰلِكَ يَوْمَئِذٍ يَوْمٌ عَسِيرٌ","عَلَى الْكَافِرِينَ غَيْرُ يَسِيرٍ","ذَرْنِي وَمَنْ خَلَقْتُ وَحِيدًا","وَجَعَلْتُ لَهُ مَالًا مَّمْدُودًا","وَبَنِينَ شُهُودًا","وَمَهَّدتُّ لَهُ تَمْهِيدًا","ثُمَّ يَطْمَعُ أَنْ أَزِيدَ","كَلَّا ۖ إِنَّهُ كَانَ لِآيَاتِنَا عَنِيدًا","سَأُرْهِقُهُ صَعُودًا","إِنَّهُ فَكَّرَ وَقَدَّرَ","فَقُتِلَ كَيْفَ قَدَّرَ","ثُمَّ قُتِلَ كَيْفَ قَدَّرَ","ثُمَّ نَظَرَ","ثُمَّ عَبَسَ وَبَسَرَ","ثُمَّ أَدْبَرَ وَاسْتَكْبَرَ","فَقَالَ إِنْ هَـٰذَا إِلَّا سِحْرٌ يُؤْثَرُ","إِنْ هَـٰذَا إِلَّا قَوْلُ الْبَشَرِ","سَأُصْلِيهِ سَقَرَ","وَمَا أَدْرَاكَ مَا سَقَرُ","لَا تُبْقِي وَلَا تَذَرُ","لَوَّاحَةٌ لِّلْبَشَرِ","عَلَيْهَا تِسْعَةَ عَشَرَ","وَمَا جَعَلْنَا أَصْحَابَ النَّارِ إِلَّا مَلَائِكَةً ۙ وَمَا جَعَلْنَا عِدَّتَهُمْ إِلَّا فِتْنَةً لِّلَّذِينَ كَفَرُوا لِيَسْتَيْقِنَ الَّذِينَ أُوتُوا الْكِتَابَ وَيَزْدَادَ الَّذِينَ آمَنُوا إِيمَانًا ۙ وَلَا يَرْتَابَ الَّذِينَ أُوتُوا الْكِتَابَ وَالْمُؤْمِنُونَ ۙ وَلِيَقُولَ الَّذِينَ فِي قُلُوبِهِم مَّرَضٌ وَالْكَافِرُونَ مَاذَا أَرَادَ اللَّهُ بِهَـٰذَا مَثَلًا ۚ كَذَٰلِكَ يُضِلُّ اللَّهُ مَن يَشَاءُ وَيَهْدِي مَن يَشَاءُ ۚ وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَ ۚ وَمَا هِيَ إِلَّا ذِكْرَىٰ لِلْبَشَرِ","كَلَّا وَالْقَمَرِ","وَاللَّيْلِ إِذْ أَدْبَرَ","وَالصُّبْحِ إِذَا أَسْفَرَ","إِنَّهَا لَإِحْدَى الْكُبَرِ","نَذِيرًا لِّلْبَشَرِ","لِمَن شَاءَ مِنكُمْ أَن يَتَقَدَّمَ أَوْ يَتَأَخَّرَ","كُلُّ نَفْسٍ بِمَا كَسَبَتْ رَهِينَةٌ","إِلَّا أَصْحَابَ الْيَمِينِ","فِي جَنَّاتٍ يَتَسَاءَلُونَ","عَنِ الْمُجْرِمِينَ","مَا سَلَكَكُمْ فِي سَقَرَ","قَالُوا لَمْ نَكُ مِنَ الْمُصَلِّينَ","وَلَمْ نَكُ نُطْعِمُ الْمِسْكِينَ","وَكُنَّا نَخُوضُ مَعَ الْخَائِضِينَ","وَكُنَّا نُكَذِّبُ بِيَوْمِ الدِّينِ","حَتَّىٰ أَتَانَا الْيَقِينُ","فَمَا تَنفَعُهُمْ شَفَاعَةُ الشَّافِعِينَ","فَمَا لَهُمْ عَنِ التَّذْكِرَةِ مُعْرِضِينَ","كَأَنَّهُمْ حُمُرٌ مُّسْتَنفِرَةٌ","فَرَّتْ مِن قَسْوَرَةٍ","بَلْ يُرِيدُ كُلُّ امْرِئٍ مِّنْهُمْ أَن يُؤْتَىٰ صُحُفًا مُّنَشَّرَةً","كَلَّا ۖ بَل لَّا يَخَافُونَ الْآخِرَةَ","كَلَّا إِنَّهُ تَذْكِرَةٌ","فَمَن شَاءَ ذَكَرَهُ","وَمَا يَذْكُرُونَ إِلَّا أَن يَشَاءَ اللَّهُ ۚ هُوَ أَهْلُ التَّقْوَىٰ وَأَهْلُ الْمَغْفِرَةِ "
                ], 
          
               "القيامة"  : [
                  
             " لَا أُقْسِمُ بِيَوْمِ الْقِيَامَةِ","وَلَا أُقْسِمُ بِالنَّفْسِ اللَّوَّامَةِ","أَيَحْسَبُ الْإِنسَانُ أَلَّن نَّجْمَعَ عِظَامَهُ","بَلَىٰ قَادِرِينَ عَلَىٰ أَن نُّسَوِّيَ بَنَانَهُ","بَلْ يُرِيدُ الْإِنسَانُ لِيَفْجُرَ أَمَامَهُ","يَسْأَلُ أَيَّانَ يَوْمُ الْقِيَامَةِ","فَإِذَا بَرِقَ الْبَصَرُ","وَخَسَفَ الْقَمَرُ","وَجُمِعَ الشَّمْسُ وَالْقَمَرُ","يَقُولُ الْإِنسَانُ يَوْمَئِذٍ أَيْنَ الْمَفَرُّ","كَلَّا لَا وَزَرَ","إِلَىٰ رَبِّكَ يَوْمَئِذٍ الْمُسْتَقَرُّ","يُنَبَّأُ الْإِنسَانُ يَوْمَئِذٍ بِمَا قَدَّمَ وَأَخَّرَ","بَلِ الْإِنسَانُ عَلَىٰ نَفْسِهِ بَصِيرَةٌ","وَلَوْ أَلْقَىٰ مَعَاذِيرَهُ","لَا تُحَرِّكْ بِهِ لِسَانَكَ لِتَعْجَلَ بِهِط","إِنَّ عَلَيْنَا جَمْعَهُ وَقُرْآنَهُ","فَإِذَا قَرَأْنَاهُ فَاتَّبِعْ قُرْآنَهُ","ثُمَّ إِنَّ عَلَيْنَا بَيَانَهُ","كَلَّا بَلْ تُحِبُّونَ الْعَاجِلَةَ","وَتَذَرُونَ الْآخِرَةَ","وُجُوهٌ يَوْمَئِذٍ نَّاضِرَةٌ","إِلَىٰ رَبِّهَا نَاظِرَةٌ","وَوُجُوهٌ يَوْمَئِذٍ بَاسِرَةٌ","تَظُنُّ أَن يُفْعَلَ بِهَا فَاقِرَةٌ","كَلَّا إِذَا بَلَغَتِ التَّرَاقِيَ","وَقِيلَ مَنْ ۜ رَاقٍ","وَظَنَّ أَنَّهُ الْفِرَاقُ","وَالْتَفَّتِ السَّاقُ بِالسَّاقِ","إِلَىٰ رَبِّكَ يَوْمَئِذٍ الْمَسَاقُ","فَلَا صَدَّقَ وَلَا صَلَّىٰ","وَلَـٰكِن كَذَّبَ وَتَوَلَّىٰ","ثُمَّ ذَهَبَ إِلَىٰ أَهْلِهِ يَتَمَطَّىٰ","أَوْلَىٰ لَكَ فَأَوْلَىٰ","ثُمَّ أَوْلَىٰ لَكَ فَأَوْلَىٰ","أَيَحْسَبُ الْإِنسَانُ أَن يُتْرَكَ سُدًى","أَلَمْ يَكُ نُطْفَةً مِّن مَّنِيٍّ يُمْنَىٰ","ثُمَّ كَانَ عَلَقَةً فَخَلَقَ فَسَوَّىٰ","فَجَعَلَ مِنْهُ الزَّوْجَيْنِ الذَّكَرَ وَالْأُنثَىٰ","أَلَيْسَ ذَٰلِكَ بِقَادِرٍ عَلَىٰ أَن يُحْيِيَ الْمَوْتَىٰ"
               ],
          "الانسان" : [
          "هَلْ أَتَىٰ عَلَى الْإِنسَانِ حِينٌ مِّنَ الدَّهْرِ لَمْ يَكُن شَيْئًا مَّذْكُورًا","إِنَّا خَلَقْنَا الْإِنسَانَ مِن نُّطْفَةٍ أَمْشَاجٍ نَّبْتَلِيهِ فَجَعَلْنَاهُ سَمِيعًا بَصِيرًا","إِنَّا هَدَيْنَاهُ السَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا","إِنَّا أَعْتَدْنَا لِلْكَافِرِينَ سَلَاسِلَ وَأَغْلَالًا وَسَعِيرًا","إِنَّ الْأَبْرَارَ يَشْرَبُونَ مِن كَأْسٍ كَانَ مِزَاجُهَا كَافُورًا","عَيْنًا يَشْرَبُ بِهَا عِبَادُ اللَّهِ يُفَجِّرُونَهَا تَفْجِيرًا","يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْمًا كَانَ شَرُّهُ مُسْتَطِيرًا","وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا","إِنَّمَا نُطْعِمُكُمْ لِوَجْهِ اللَّهِ لَا نُرِيدُ مِنكُمْ جَزَاءً وَلَا شُكُورًا","إِنَّا نَخَافُ مِن رَّبِّنَا يَوْمًا عَبُوسًا قَمْطَرِيرًا","فَوَقَاهُمُ اللَّهُ شَرَّ ذَٰلِكَ الْيَوْمِ وَلَقَّاهُمْ نَضْرَةً وَسُرُورًا","وَجَزَاهُم بِمَا صَبَرُوا جَنَّةً وَحَرِيرًا","مُّتَّكِئِينَ فِيهَا عَلَى الْأَرَائِكِ ۖ لَا يَرَوْنَ فِيهَا شَمْسًا وَلَا زَمْهَرِيرًا","وَدَانِيَةً عَلَيْهِمْ ظِلَالُهَا وَذُلِّلَتْ قُطُوفُهَا تَذْلِيلًا","وَيُطَافُ عَلَيْهِم بِآنِيَةٍ مِّن فِضَّةٍ وَأَكْوَابٍ كَانَتْ قَوَارِيرَا","قَوَارِيرَ مِن فِضَّةٍ قَدَّرُوهَا تَقْدِيرًا","وَيُسْقَوْنَ فِيهَا كَأْسًا كَانَ مِزَاجُهَا زَنجَبِيلًا","عَيْنًا فِيهَا تُسَمَّىٰ سَلْسَبِيلًا","وَيَطُوفُ عَلَيْهِمْ وِلْدَانٌ مُّخَلَّدُونَ إِذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤًا مَّنثُورًا","وَإِذَا رَأَيْتَ ثَمَّ رَأَيْتَ نَعِيمًا وَمُلْكًا كَبِيرًا","عَالِيَهُمْ ثِيَابُ سُندُسٍ خُضْرٌ وَإِسْتَبْرَقٌ ۖ وَحُلُّوا أَسَاوِرَ مِن فِضَّةٍ وَسَقَاهُمْ رَبُّهُمْ شَرَابًا طَهُورًا","إِنَّ هَـٰذَا كَانَ لَكُمْ جَزَاءً وَكَانَ سَعْيُكُم مَّشْكُورًا","إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ الْقُرْآنَ تَنزِيلًا","فَاصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تُطِعْ مِنْهُمْ آثِمًا أَوْ كَفُورًا","وَاذْكُرِ اسْمَ رَبِّكَ بُكْرَةً وَأَصِيلًا","وَمِنَ اللَّيْلِ فَاسْجُدْ لَهُ وَسَبِّحْهُ لَيْلًا طَوِيلًا","إِنَّ هَـٰؤُلَاءِ يُحِبُّونَ الْعَاجِلَةَ وَيَذَرُونَ وَرَاءَهُمْ يَوْمًا ثَقِيلًا","نَّحْنُ خَلَقْنَاهُمْ وَشَدَدْنَا أَسْرَهُمْ ۖ وَإِذَا شِئْنَا بَدَّلْنَا أَمْثَالَهُمْ تَبْدِيلًا","إِنَّ هَـٰذِهِ تَذْكِرَةٌ ۖ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ سَبِيلًا","وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ ۚ إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا","يُدْخِلُ مَن يَشَاءُ فِي رَحْمَتِهِ ۚ وَالظَّالِمِينَ أَعَدَّ لَهُمْ عَذَابًا أَلِيمًا"
          ],
             "المرسلات" : [
              
           " وَالْمُرْسَلَاتِ عُرْفًا","فَالْعَاصِفَاتِ عَصْفًا","وَالنَّاشِرَاتِ نَشْرًا","فَالْفَارِقَاتِ فَرْقًا","فَالْمُلْقِيَاتِ ذِكْرًا","عُذْرًا أَوْ نُذْرًا","إِنَّمَا تُوعَدُونَ لَوَاقِعٌ","فَإِذَا النُّجُومُ طُمِسَتْ","وَإِذَا السَّمَاءُ فُرِجَتْ","وَإِذَا الْجِبَالُ نُسِفَتْ","وَإِذَا الرُّسُلُ أُقِّتَتْ","لِأَيِّ يَوْمٍ أُجِّلَتْ","لِيَوْمِ الْفَصْلِ","وَمَا أَدْرَاكَ مَا يَوْمُ الْفَصْلِ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","أَلَمْ نُهْلِكِ الْأَوَّلِينَ","ثُمَّ نُتْبِعُهُمُ الْآخِرِينَ","كَذَٰلِكَ نَفْعَلُ بِالْمُجْرِمِينَ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","أَلَمْ نَخْلُقكُّم مِّن مَّاءٍ مَّهِينٍ","فَجَعَلْنَاهُ فِي قَرَارٍ مَّكِينٍ","إِلَىٰ قَدَرٍ مَّعْلُومٍ","فَقَدَرْنَا فَنِعْمَ الْقَادِرُونَ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","أَلَمْ نَجْعَلِ الْأَرْضَ كِفَاتًا","أَحْيَاءً وَأَمْوَاتًا","وَجَعَلْنَا فِيهَا رَوَاسِيَ شَامِخَاتٍ وَأَسْقَيْنَاكُم مَّاءً فُرَاتًا","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","انطَلِقُوا إِلَىٰ مَا كُنتُم بِهِ تُكَذِّبُونَ","انطَلِقُوا إِلَىٰ ظِلٍّ ذِي ثَلَاثِ شُعَبٍ","لَّا ظَلِيلٍ وَلَا يُغْنِي مِنَ اللَّهَبِ","إِنَّهَا تَرْمِي بِشَرَرٍ كَالْقَصْرِ","كَأَنَّهُ جِمَالَتٌ صُفْرٌ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","هَـٰذَا يَوْمُ لَا يَنطِقُونَ","وَلَا يُؤْذَنُ لَهُمْ فَيَعْتَذِرُونَ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","هَـٰذَا يَوْمُ الْفَصْلِ ۖ جَمَعْنَاكُمْ وَالْأَوَّلِينَ","فَإِن كَانَ لَكُمْ كَيْدٌ فَكِيدُونِ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","إِنَّ الْمُتَّقِينَ فِي ظِلَالٍ وَعُيُونٍ","وَفَوَاكِهَ مِمَّا يَشْتَهُونَ","كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا كُنتُمْ تَعْمَلُونَ","إِنَّا كَذَٰلِكَ نَجْزِي الْمُحْسِنِينَ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","كُلُوا وَتَمَتَّعُوا قَلِيلًا إِنَّكُم مُّجْرِمُونَ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","وَإِذَا قِيلَ لَهُمُ ارْكَعُوا لَا يَرْكَعُونَ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","فَبِأَيِّ حَدِيثٍ بَعْدَهُ يُؤْمِنُونَ"
             ],   
          
              
         "النبأ": [
                            
               "عَمَّ يَتَسَآءَلُونَ"," عَنِ ٱلنَّبَإِ ٱلْعَظِيمِ "," ٱلَّذِى هُمْ فِيهِ مُخْتَلِفُونَ ","كَلَّا سَيَعْلَمُونَ","ثُمَّ كَلَّا سَيَعْلَمُونَ","أَلَمْ نَجْعَلِ ٱلْأَرْضَ مِهَٰدًۭا ","وَٱلْجِبَالَ أَوْتَادًۭا ","وَخَلَقْنَٰكُمْ أَزْوَٰجًۭا ","وَجَعَلْنَا نَوْمَكُمْ سُبَاتًۭا ","وَجَعَلْنَا ٱلَّيْلَ لِبَاسًۭا","وَجَعَلْنَا ٱلنَّهَارَ مَعَاشًۭا ","وَبَنَيْنَا فَوْقَكُمْ سَبْعًۭا شِدَادًۭا","وَجَعَلْنَا سِرَاجًۭا وَهَّاجًۭا","وَأَنزَلْنَا مِنَ ٱلْمُعْصِرَٰتِ مَآءًۭ ثَجَّاجًۭا ","لِّنُخْرِجَ بِهِۦ حَبًّۭا وَنَبَاتًۭا ","وَجَنَّٰتٍ أَلْفَافًا ","إِنَّ يَوْمَ ٱلْفَصْلِ كَانَ مِيقَٰتًۭا ","يَوْمَ يُنفَخُ فِى ٱلصُّورِ فَتَأْتُونَ أَفْوَاجًۭا ","وَفُتِحَتِ ٱلسَّمَآءُ فَكَانَتْ أَبْوَٰبًۭا ","وَسُيِّرَتِ ٱلْجِبَالُ فَكَانَتْ سَرَابًا ","إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًۭا ","لِّلطَّٰغِينَ مَـَٔابًۭا ","لَّٰبِثِينَ فِيهَآ أَحْقَابًۭا ","لَّا يَذُوقُونَ فِيهَا بَرْدًۭا وَلَا شَرَابًا ","إِلَّا حَمِيمًۭا وَغَسَّاقًۭا ","جَزَآءًۭ وِفَاقًا ","إِنَّهُمْ كَانُوا۟ لَا يَرْجُونَ حِسَابًۭا ","وَكَذَّبُوا۟ بِـَٔايَٰتِنَا كِذَّابًۭا ","وَكُلَّ شَىْءٍ أَحْصَيْنَٰهُ كِتَٰبًۭا","فَذُوقُوا۟ فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا ","إِنَّ لِلْمُتَّقِينَ مَفَازًا ","حَدَآئِقَ وَأَعْنَٰبًۭا ","وَكَوَاعِبَ أَتْرَابًۭا ","وَكَأْسًۭا دِهَاقًۭا ","لَّا يَسْمَعُونَ فِيهَا لَغْوًۭا وَلَا كِذَّٰبًۭا ","جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا","رَّبِّ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ٱلرَّحْمَٰنِ ۖ لَا يَمْلِكُونَ مِنْهُ خِطَابًۭا ","يَوْمَ يَقُومُ ٱلرُّوحُ وَٱلْمَلَٰٓئِكَةُ صَفًّۭا ۖ لَّا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ ٱلرَّحْمَٰنُ وَقَالَ صَوَابًۭا ","ذَٰلِكَ ٱلْيَوْمُ ٱلْحَقُّ ۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ مَـَٔابًا ","إِنَّآ أَنذَرْنَٰكُمْ عَذَابًۭا قَرِيبًۭا يَوْمَ يَنظُرُ ٱلْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ ٱلْكَافِرُ يَٰلَيْتَنِى كُنتُ تُرَٰبًۢا"
            ],
               "النازعات": [
             " وَالنَّازِعَاتِ غَرْقًا","وَالنَّاشِطَاتِ نَشْطًا","وَالسَّابِحَاتِ سَبْحًا","فَالسَّابِقَاتِ سَبْقًا","فَالْمُدَبِّرَاتِ أَمْرًا","يَوْمَ تَرْجُفُ الرَّاجِفَةُ","تَتْبَعُهَا الرَّادِفَةُ","قُلُوبٌ يَوْمَئِذٍ وَاجِفَةٌ","أَبْصَارُهَا خَاشِعَةٌ","يَقُولُونَ أَإِنَّا لَمَرْدُودُونَ فِي الْحَافِرَةِ","أَإِذَا كُنَّا عِظَامًا نَّخِرَةً","قَالُوا تِلْكَ إِذًا كَرَّةٌ خَاسِرَةٌ","فَإِنَّمَا هِيَ زَجْرَةٌ وَاحِدَةٌ","فَإِذَا هُم بِالسَّاهِرَةِ","هَلْ أَتَاكَ حَدِيثُ مُوسَىٰ","إِذْ نَادَاهُ رَبُّهُ بِالْوَادِ الْمُقَدَّسِ طُوًى","اذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُ طَغَىٰ","فَقُلْ هَل لَّكَ إِلَىٰ أَن تَزَكَّىٰ","وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ","فَأَرَاهُ الْآيَةَ الْكُبْرَىٰ","فَكَذَّبَ وَعَصَىٰ","ثُمَّ أَدْبَرَ يَسْعَىٰ","فَحَشَرَ فَنَادَىٰ","فَقَالَ أَنَا رَبُّكُمُ الْأَعْلَىٰ","فَأَخَذَهُ اللَّهُ نَكَالَ الْآخِرَةِ وَالْأُولَىٰ","إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِّمَن يَخْشَىٰ","أَأَنتُمْ أَشَدُّ خَلْقًا أَمِ السَّمَاءُ ۚ بَنَاهَا","رَفَعَ سَمْكَهَا فَسَوَّاهَا","وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَاهَا","وَالْأَرْضَ بَعْدَ ذَٰلِكَ دَحَاهَا","أَخْرَجَ مِنْهَا مَاءَهَا وَمَرْعَاهَا","وَالْجِبَالَ أَرْسَاهَا","مَتَاعًا لَّكُمْ وَلِأَنْعَامِكُمْ","فَإِذَا جَاءَتِ الطَّامَّةُ الْكُبْرَىٰ","يَوْمَ يَتَذَكَّرُ الْإِنسَانُ مَا سَعَىٰ","وَبُرِّزَتِ الْجَحِيمُ لِمَن يَرَىٰ","فَأَمَّا مَن طَغَىٰ","وَآثَرَ الْحَيَاةَ الدُّنْيَا","فَإِنَّ الْجَحِيمَ هِيَ الْمَأْوَىٰ","وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَىٰ","فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَىٰ","يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا","فِيمَ أَنتَ مِن ذِكْرَاهَا","إِلَىٰ رَبِّكَ مُنتَهَاهَا","إِنَّمَا أَنتَ مُنذِرُ مَن يَخْشَاهَا","كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوا إِلَّا عَشِيَّةً أَوْ ضُحَاهَا"
               
          ],
              "عبس": [ 
            " عَبَسَ وَتَوَلَّىٰ","أَن جَاءَهُ الْأَعْمَىٰ","وَمَا يُدْرِيكَ لَعَلَّهُ يَزَّكَّىٰ", "أَوْ يَذَّكَّرُ فَتَنفَعَهُ الذِّكْرَىٰ ","أَمَّا مَنِ اسْتَغْنَىٰ","فَأَنتَ لَهُ تَصَدَّىٰ","وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ","وَأَمَّا مَن جَاءَكَ يَسْعَىٰ","وَهُوَ يَخْشَىٰ","فَأَنتَ عَنْهُ تَلَهَّىٰ","كَلَّا إِنَّهَا تَذْكِرَةٌ","فَمَن شَاءَ ذَكَرَهُ","فِي صُحُفٍ مُّكَرَّمَةٍ","مَّرْفُوعَةٍ مُّطَهَّرَةٍ","بِأَيْدِي سَفَرَةٍ","كِرَامٍ بَرَرَةٍ","قُتِلَ الْإِنسَانُ مَا أَكْفَرَهُ","مِنْ أَيِّ شَيْءٍ خَلَقَهُ","مِن نُّطْفَةٍ خَلَقَهُ فَقَدَّرَهُ","ثُمَّ السَّبِيلَ يَسَّرَهُ","ثُمَّ أَمَاتَهُ فَأَقْبَرَهُ","ثُمَّ إِذَا شَاءَ أَنشَرَهُ","كَلَّا لَمَّا يَقْضِ مَا أَمَرَهُ","فَلْيَنظُرِ الْإِنسَانُ إِلَىٰ طَعَامِهِ","أَنَّا صَبَبْنَا الْمَاءَ صَبًّا","ثُمَّ شَقَقْنَا الْأَرْضَ شَقًّا","فَأَنبَتْنَا فِيهَا حَبًّا","وَعِنَبًا وَقَضْبًا","وَزَيْتُونًا وَنَخْلًا","وَحَدَائِقَ غُلْبًا","وَفَاكِهَةً وَأَبًّا","مَّتَاعًا لَّكُمْ وَلِأَنْعَامِكُمْ","فَإِذَا جَاءَتِ الصَّاخَّةُ","يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ","وَأُمِّهِ وَأَبِيهِ","وَصَاحِبَتِهِ وَبَنِيهِ","لِكُلِّ امْرِئٍ مِّنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ","وُجُوهٌ يَوْمَئِذٍ مُّسْفِرَةٌ","ضَاحِكَةٌ مُّسْتَبْشِرَةٌ","وَوُجُوهٌ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌ","تَرْهَقُهَا قَتَرَةٌ","أُولَـٰئِكَ هُمُ الْكَفَرَةُ الْفَجَرَةُ"
           ],
                   "التكوير"  : [
                      " إِذَا ٱلشَّمْسُ كُوِّرَتْ","وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتْ ","وَإِذَا ٱلْجِبَالُ سُيِّرَتْ ","وَإِذَا ٱلْعِشَارُ عُطِّلَتْ ","وَإِذَا ٱلْوُحُوشُ حُشِرَتْ ","وَإِذَا ٱلْبِحَارُ سُجِّرَتْ ","وَإِذَا ٱلنُّفُوسُ زُوِّجَتْ ","وَإِذَا ٱلْمَوْءُۥدَةُ سُئِلَتْ","بِأَىِّ ذَنۢبٍۢ قُتِلَتْ","وَإِذَا ٱلصُّحُفُ نُشِرَتْ ","وَإِذَا ٱلسَّمَآءُ كُشِطَتْ ","وَإِذَا ٱلْجَحِيمُ سُعِّرَتْ","وَإِذَا ٱلْجَنَّةُ أُزْلِفَتْ ","عَلِمَتْ نَفْسٌۭ مَّآ أَحْضَرَتْ ","فَلَآ أُقْسِمُ بِٱلْخُنَّسِ","ٱلْجَوَارِ ٱلْكُنَّسِ","وَٱلَّيْلِ إِذَا عَسْعَسَ ","وَٱلصُّبْحِ إِذَا تَنَفَّسَ","إِنَّهُۥ لَقَوْلُ رَسُولٍۢ كَرِيمٍۢ ","ذِى قُوَّةٍ عِندَ ذِى ٱلْعَرْشِ مَكِينٍۢ ","مُّطَاعٍۢ ثَمَّ أَمِينٍۢ ","وَمَا صَاحِبُكُم بِمَجْنُونٍۢ","وَلَقَدْ رَءَاهُ بِٱلْأُفُقِ ٱلْمُبِينِ ","وَمَا هُوَ عَلَى ٱلْغَيْبِ بِضَنِينٍۢ","وَمَا هُوَ بِقَوْلِ شَيْطَٰنٍۢ رَّجِيمٍۢ ","فَأَيْنَ تَذْهَبُونَ ","إِنْ هُوَ إِلَّا ذِكْرٌۭ لِّلْعَٰلَمِينَ ","لِمَن شَآءَ مِنكُمْ أَن يَسْتَقِيمَ ","وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلْعَٰلَمِينَ "
                   ],
           
             "الانفطار": [
                " إِذَا السَّمَاءُ انفَطَرَتْ","وَإِذَا الْكَوَاكِبُ انتَثَرَتْ","وَإِذَا الْبِحَارُ فُجِّرَتْ","وَإِذَا الْقُبُورُ بُعْثِرَتْ","عَلِمَتْ نَفْسٌ مَّا قَدَّمَتْ وَأَخَّرَتْ","يَا أَيُّهَا الْإِنسَانُ مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ","الَّذِي خَلَقَكَ فَسَوَّاكَ فَعَدَلَكَ","فِي أَيِّ صُورَةٍ مَّا شَاءَ رَكَّبَكَ","كَلَّا بَلْ تُكَذِّبُونَ بِالدِّينِ","وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ","كِرَامًا كَاتِبِينَ","يَعْلَمُونَ مَا تَفْعَلُونَ","إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ","وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ","يَصْلَوْنَهَا يَوْمَ الدِّينِ","وَمَا هُمْ عَنْهَا بِغَائِبِينَ","وَمَا أَدْرَاكَ مَا يَوْمُ الدِّينِ","ثُمَّ مَا أَدْرَاكَ مَا يَوْمُ الدِّينِ","يَوْمَ لَا تَمْلِكُ نَفْسٌ لِّنَفْسٍ شَيْئًا ۖ وَالْأَمْرُ يَوْمَئِذٍ لِّلَّهِ"
            ],
             "المطففين": [
         
           "وَيۡلٞ لِّلۡمُطَفِّفِينَ","ٱلَّذِينَ إِذَا ٱكۡتَالُواْ عَلَى ٱلنَّاسِ يَسۡتَوۡفُونَ","وَإِذَا كَالُوهُمۡ أَو وَّزَنُوهُمۡ يُخۡسِرُونَ","أَلَا يَظُنُّ أُوْلَٰٓئِكَ أَنَّهُم مَّبۡعُوثُونَ","لِيَوۡمٍ عَظِيمٖ","يَوۡمَ يَقُومُ ٱلنَّاسُ لِرَبِّ ٱلۡعَٰلَمِينَ","كَلَّآ إِنَّ كِتَٰبَ ٱلۡفُجَّارِ لَفِي سِجِّينٖ","وَمَآ أَدۡرَىٰكَ مَا سِجِّينٞ","كِتَٰبٞ مَّرۡقُومٞ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","ٱلَّذِينَ يُكَذِّبُونَ بِيَوۡمِ ٱلدِّينِ","وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعۡتَدٍ أَثِيمٍ","إِذَا تُتۡلَىٰ عَلَيۡهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلۡأَوَّلِينَ","كَلَّاۖ بَلۡۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكۡسِبُونَ","كَلَّآ إِنَّهُمۡ عَن رَّبِّهِمۡ يَوۡمَئِذٖ لَّمَحۡجُوبُونَ","ثُمَّ إِنَّهُمۡ لَصَالُواْ ٱلۡجَحِيمِ","ثُمَّ يُقَالُ هَٰذَا ٱلَّذِي كُنتُم بِهِۦ تُكَذِّبُونَ","كَلَّآ إِنَّ كِتَٰبَ ٱلۡأَبۡرَارِ لَفِي عِلِّيِّينَ","وَمَآ أَدۡرَىٰكَ مَا عِلِّيُّونَ","كِتَٰبٞ مَّرۡقُومٞ","يَشۡهَدُهُ ٱلۡمُقَرَّبُونَ","إِنَّ ٱلۡأَبۡرَارَ لَفِي نَعِيمٍ","عَلَى ٱلۡأَرَآئِكِ يَنظُرُونَ","تَعۡرِفُ فِي وُجُوهِهِمۡ نَضۡرَةَ ٱلنَّعِيمِ","يُسۡقَوۡنَ مِن رَّحِيقٖ مَّخۡتُومٍ","خِتَٰمُهُۥ مِسۡكٞۚ وَفِي ذَٰلِكَ فَلۡيَتَنَافَسِ ٱلۡمُتَنَٰفِسُونَ","وَمِزَاجُهُۥ مِن تَسۡنِيمٍ","عَيۡنٗا يَشۡرَبُ بِهَا ٱلۡمُقَرَّبُونَ","إِنَّ ٱلَّذِينَ أَجۡرَمُواْ كَانُواْ مِنَ ٱلَّذِينَ ءَامَنُواْ يَضۡحَكُونَ","وَإِذَا مَرُّواْ بِهِمۡ يَتَغَامَزُونَ","وَإِذَا ٱنقَلَبُوٓاْ إِلَىٰٓ أَهۡلِهِمُ ٱنقَلَبُواْ فَكِهِينَ","وَإِذَا رَأَوۡهُمۡ قَالُوٓاْ إِنَّ هَٰٓؤُلَآءِ لَضَآلُّونَ","وَمَآ أُرۡسِلُواْ عَلَيۡهِمۡ حَٰفِظِينَ","فَٱلۡيَوۡمَ ٱلَّذِينَ ءَامَنُواْ مِنَ ٱلۡكُفَّارِ يَضۡحَكُونَ","عَلَى ٱلۡأَرَآئِكِ يَنظُرُونَ","هَلۡ ثُوِّبَ ٱلۡكُفَّارُ مَا كَانُواْ يَفۡعَلُونَ"
             ],
           
               "الانشقاق": [
                   "إِذَا ٱلسَّمَآءُ ٱنشَقَّتۡ","وَأَذِنَتۡ لِرَبِّهَا وَحُقَّتۡ","وَإِذَا ٱلۡأَرۡضُ مُدَّتۡ","وَأَلۡقَتۡ مَا فِيهَا وَتَخَلَّتۡ","وَأَذِنَتۡ لِرَبِّهَا وَحُقَّتۡ","يَٰٓأَيُّهَا ٱلۡإِنسَٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدۡحٗا فَمُلَٰقِيهِ","فَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ","فَسَوۡفَ يُحَاسَبُ حِسَابٗا يَسِيرٗا","وَيَنقَلِبُ إِلَىٰٓ أَهۡلِهِۦ مَسۡرُورٗا","وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ وَرَآءَ ظَهۡرِهِۦ","فَسَوۡفَ يَدۡعُواْ ثُبُورٗا","وَيَصۡلَىٰ سَعِيرًا","إِنَّهُۥ كَانَ فِيٓ أَهۡلِهِۦ مَسۡرُورًا","إِنَّهُۥ ظَنَّ أَن لَّن يَحُورَ","بَلَىٰٓۚ إِنَّ رَبَّهُۥ كَانَ بِهِۦ بَصِيرٗا","فَلَآ أُقۡسِمُ بِٱلشَّفَقِ","وَٱلَّيۡلِ وَمَا وَسَقَ","وَٱلۡقَمَرِ إِذَا ٱتَّسَقَ","لَتَرۡكَبُنَّ طَبَقًا عَن طَبَقٖ","فَمَا لَهُمۡ لَا يُؤۡمِنُونَ","وَإِذَا قُرِئَ عَلَيۡهِمُ ٱلۡقُرۡءَانُ لَا يَسۡجُدُونَۤ۩","سجدةبَلِ ٱلَّذِينَ كَفَرُواْ يُكَذِّبُونَ","وَٱللَّهُ أَعۡلَمُ بِمَا يُوعُونَ","فَبَشِّرۡهُم بِعَذَابٍ أَلِيمٍ","إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ لَهُمۡ أَجۡرٌ غَيۡرُ مَمۡنُونِۭ"
               ],
           
                "البروج": [
            "وَالسَّمَاءِ ذَاتِ الْبُرُوجِ","وَالْيَوْمِ الْمَوْعُودِ","وَشَاهِدٍ وَمَشْهُودٍ","قُتِلَ أَصْحَابُ الْأُخْدُودِ","النَّارِ ذَاتِ الْوَقُودِ","إِذْ هُمْ عَلَيْهَا قُعُودٌ","وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِالْمُؤْمِنِينَ شُهُودٌ","وَمَا نَقَمُوا مِنْهُمْ إِلَّا أَن يُؤْمِنُوا بِاللَّهِ الْعَزِيزِ الْحَمِيدِ","الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ ۚ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ","إِنَّ الَّذِينَ فَتَنُوا الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ ثُمَّ لَمْ يَتُوبُوا فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ الْحَرِيقِ","إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ ۚ ذَٰلِكَ الْفَوْزُ الْكَبِيرُ","إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ","إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ","وَهُوَ الْغَفُورُ الْوَدُودُ","ذُو الْعَرْشِ الْمَجِيدُ","فَعَّالٌ لِّمَا يُرِيدُ" ,,"هَلْ أَتَاكَ حَدِيثُ الْجُنُودِ","فِرْعَوْنَ وَثَمُودَ","بَلِ الَّذِينَ كَفَرُوا فِي تَكْذِيبٍ","وَاللَّهُ مِن وَرَائِهِم مُّحِيطٌ","بَلْ هُوَ قُرْآنٌ مَّجِيدٌ","فِي لَوْحٍ مَّحْفُوظٍ" 
                ], 
          
               "الطارق"  : [
                    " وَالسَّمَاءِ وَالطَّارِقِ","وَمَا أَدْرَاكَ مَا الطَّارِقُ","النَّجْمُ الثَّاقِبُ","إِن كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌ","فَلْيَنظُرِ الْإِنسَانُ مِمَّ خُلِقَ","خُلِقَ مِن مَّاءٍ دَافِقٍ","يَخْرُجُ مِن بَيْنِ الصُّلْبِ وَالتَّرَائِبِ","إِنَّهُ عَلَىٰ رَجْعِهِ لَقَادِرٌ","يَوْمَ تُبْلَى السَّرَائِرُ","فَمَا لَهُ مِن قُوَّةٍ وَلَا نَاصِرٍ","وَالسَّمَاءِ ذَاتِ الرَّجْعِ","وَالْأَرْضِ ذَاتِ الصَّدْعِ","إِنَّهُ لَقَوْلٌ فَصْلٌ","وَمَا هُوَ بِالْهَزْلِ","إِنَّهُمْ يَكِيدُونَ كَيْدًا","وَأَكِيدُ كَيْدًا","فَمَهِّلِ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْدًا"
               ],
          "الاعلى" : [
           "  سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى","الَّذِي خَلَقَ فَسَوَّىٰ","وَالَّذِي قَدَّرَ فَهَدَىٰ","وَالَّذِي أَخْرَجَ الْمَرْعَىٰ","فَجَعَلَهُ غُثَاءً أَحْوَىٰ","سَنُقْرِئُكَ فَلَا تَنسَىٰ","إِلَّا مَا شَاءَ اللَّهُ ۚ إِنَّهُ يَعْلَمُ الْجَهْرَ وَمَا يَخْفَىٰ","وَنُيَسِّرُكَ لِلْيُسْرَىٰ","فَذَكِّرْ إِن نَّفَعَتِ الذِّكْرَىٰ","سَيَذَّكَّرُ مَن يَخْشَىٰ","وَيَتَجَنَّبُهَا الْأَشْقَى","الَّذِي يَصْلَى النَّارَ الْكُبْرَىٰ","ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ","قَدْ أَفْلَحَ مَن تَزَكَّىٰ","وَذَكَرَ اسْمَ رَبِّهِ فَصَلَّىٰ","بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا","وَالْآخِرَةُ خَيْرٌ وَأَبْقَىٰ","إِنَّ هَـٰذَا لَفِي الصُّحُفِ الْأُولَىٰ","صُحُفِ إِبْرَاهِيمَ وَمُوسَىٰ"
        ],
             "الغاشية" : [
                 " هَلْ أَتَاكَ حَدِيثُ الْغَاشِيَةِ","وُجُوهٌ يَوْمَئِذٍ خَاشِعَةٌ","عَامِلَةٌ نَّاصِبَةٌ","تَصْلَىٰ نَارًا حَامِيَةً","تُسْقَىٰ مِنْ عَيْنٍ آنِيَةٍ","لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍ","لَّا يُسْمِنُ وَلَا يُغْنِي مِن جُوعٍ","وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ","لِّسَعْيِهَا رَاضِيَةٌ","فِي جَنَّةٍ عَالِيَةٍ","لَّا تَسْمَعُ فِيهَا لَاغِيَةً","فِيهَا عَيْنٌ جَارِيَةٌ","فِيهَا سُرُرٌ مَّرْفُوعَةٌ","وَأَكْوَابٌ مَّوْضُوعَةٌ","وَنَمَارِقُ مَصْفُوفَةٌ","وَزَرَابِيُّ مَبْثُوثَةٌ","أَفَلَا يَنظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ","وَإِلَى السَّمَاءِ كَيْفَ رُفِعَتْ","وَإِلَى الْجِبَالِ كَيْفَ نُصِبَتْ","وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ","فَذَكِّرْ إِنَّمَا أَنتَ مُذَكِّرٌ","لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ","إِلَّا مَن تَوَلَّىٰ وَكَفَرَ","فَيُعَذِّبُهُ اللَّهُ الْعَذَابَ الْأَكْبَرَ","إِنَّ إِلَيْنَا إِيَابَهُمْ","ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم "
             ],   
           "الفجر": [ 
               " وَالْفَجْرِ","وَلَيَالٍ عَشْرٍ","وَالشَّفْعِ وَالْوَتْرِ","وَاللَّيْلِ إِذَا يَسْرِ","هَلْ فِي ذَٰلِكَ قَسَمٌ لِّذِي حِجْرٍ","أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ","إِرَمَ ذَاتِ الْعِمَادِ","الَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي الْبِلَادِ","وَثَمُودَ الَّذِينَ جَابُوا الصَّخْرَ بِالْوَادِ","وَفِرْعَوْنَ ذِي الْأَوْتَادِ","الَّذِينَ طَغَوْا فِي الْبِلَادِ","فَأَكْثَرُوا فِيهَا الْفَسَادَ","فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ","إِنَّ رَبَّكَ لَبِالْمِرْصَادِ","فَأَمَّا الْإِنسَانُ إِذَا مَا ابْتَلَاهُ رَبُّهُ فَأَكْرَمَهُ وَنَعَّمَهُ فَيَقُولُ رَبِّي أَكْرَمَنِ","وَأَمَّا إِذَا مَا ابْتَلَاهُ فَقَدَرَ عَلَيْهِ رِزْقَهُ فَيَقُولُ رَبِّي أَهَانَنِ","كَلَّا ۖ بَل لَّا تُكْرِمُونَ الْيَتِيمَ","وَلَا تَحَاضُّونَ عَلَىٰ طَعَامِ الْمِسْكِينِ","وَتَأْكُلُونَ التُّرَاثَ أَكْلًا لَّمًّا","وَتُحِبُّونَ الْمَالَ حُبًّا جَمًّا","كَلَّا إِذَا دُكَّتِ الْأَرْضُ دَكًّا دَكًّا","وَجَاءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّا","وَجِيءَ يَوْمَئِذٍ بِجَهَنَّمَ ۚ يَوْمَئِذٍ يَتَذَكَّرُ الْإِنسَانُ وَأَنَّىٰ لَهُ الذِّكْرَىٰ","يَقُولُ يَا لَيْتَنِي قَدَّمْتُ لِحَيَاتِي","فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُ أَحَدٌ","وَلَا يُوثِقُ وَثَاقَهُ أَحَدٌ","يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ","ارْجِعِي إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً","فَادْخُلِي فِي عِبَادِي","وَادْخُلِي جَنَّتِي"
           ],
              "البلد" : [  
                " لَا أُقْسِمُ بِهَـٰذَا الْبَلَدِ","وَأَنتَ حِلٌّ بِهَـٰذَا الْبَلَدِ","وَوَالِدٍ وَمَا وَلَدَ","لَقَدْ خَلَقْنَا الْإِنسَانَ فِي كَبَدٍ","أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌ","يَقُولُ أَهْلَكْتُ مَالًا لُّبَدًا","أَيَحْسَبُ أَن لَّمْ يَرَهُ أَحَدٌ","أَلَمْ نَجْعَل لَّهُ عَيْنَيْنِ","وَلِسَانًا وَشَفَتَيْنِ","وَهَدَيْنَاهُ النَّجْدَيْنِ","فَلَا اقْتَحَمَ الْعَقَبَةَ","وَمَا أَدْرَاكَ مَا الْعَقَبَةُ","فَكُّ رَقَبَةٍ","أَوْ إِطْعَامٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ","يَتِيمًا ذَا مَقْرَبَةٍ","أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ","ثُمَّ كَانَ مِنَ الَّذِينَ آمَنُوا وَتَوَاصَوْا بِالصَّبْرِ وَتَوَاصَوْا بِالْمَرْحَمَةِ","أُولَـٰئِكَ أَصْحَابُ الْمَيْمَنَةِ","وَالَّذِينَ كَفَرُوا بِآيَاتِنَا هُمْ أَصْحَابُ الْمَشْأَمَةِ","عَلَيْهِمْ نَارٌ مُّؤْصَدَةٌ "
                 ],
              "الشمس": [   
                  " وَالشَّمْسِ وَضُحَاهَا","وَالْقَمَرِ إِذَا تَلَاهَا","وَالنَّهَارِ إِذَا جَلَّاهَا","وَاللَّيْلِ إِذَا يَغْشَاهَا","وَالسَّمَاءِ وَمَا بَنَاهَا","وَالْأَرْضِ وَمَا طَحَاهَا","وَنَفْسٍ وَمَا سَوَّاهَا","فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا","قَدْ أَفْلَحَ مَن زَكَّاهَا","وَقَدْ خَابَ مَن دَسَّاهَا","كَذَّبَتْ ثَمُودُ بِطَغْوَاهَا","إِذِ انبَعَثَ أَشْقَاهَا","فَقَالَ لَهُمْ رَسُولُ اللَّهِ نَاقَةَ اللَّهِ وَسُقْيَاهَا","فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنبِهِمْ فَسَوَّاهَا","وَلَا يَخَافُ عُقْبَاهَا"
              ],
             "الليل": [
            " وَاللَّيْلِ إِذَا يَغْشَىٰ","وَالنَّهَارِ إِذَا تَجَلَّىٰ","وَمَا خَلَقَ الذَّكَرَ وَالْأُنثَىٰ","إِنَّ سَعْيَكُمْ لَشَتَّىٰ","فَأَمَّا مَنْ أَعْطَىٰ وَاتَّقَىٰ","وَصَدَّقَ بِالْحُسْنَىٰ","فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ","وَأَمَّا مَن بَخِلَ وَاسْتَغْنَىٰ","وَكَذَّبَ بِالْحُسْنَىٰ","فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ","وَمَا يُغْنِي عَنْهُ مَالُهُ إِذَا تَرَدَّىٰ","إِنَّ عَلَيْنَا لَلْهُدَىٰ","وَإِنَّ لَنَا لَلْآخِرَةَ وَالْأُولَىٰ","فَأَنذَرْتُكُمْ نَارًا تَلَظَّىٰ","لَا يَصْلَاهَا إِلَّا الْأَشْقَى","الَّذِي كَذَّبَ وَتَوَلَّىٰ","وَسَيُجَنَّبُهَا الْأَتْقَى","الَّذِي يُؤْتِي مَالَهُ يَتَزَكَّىٰ","وَمَا لِأَحَدٍ عِندَهُ مِن نِّعْمَةٍ تُجْزَىٰ","إِلَّا ابْتِغَاءَ وَجْهِ رَبِّهِ الْأَعْلَىٰ","وَلَسَوْفَ يَرْضَىٰ"
             ],
              "الضحى": [  
                   " وَالضُّحَىٰ","وَاللَّيْلِ إِذَا سَجَىٰ","مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ","وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ","وَوَجَدَكَ ضَالًّا فَهَدَىٰ","وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ","فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ","وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ","وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ"
               ],
             "الشرح": [
                 "أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ", "وَوَضَعْنَا عَنكَ وِزْرَكَ", "الَّذِي أَنقَضَ ظَهْرَكَ", "وَرَفَعْنَا لَكَ ذِكْرَكَ", "فإِنَّ مَعَ الْعُسْرِ يُسْرًا", "إِنَّ مَعَ الْعُسْرِ يُسْرًا", "فَإِذَا فَرَغْتَ فَانصَبْ", "وَإِلَىٰ رَبِّكَ فَارْغَبْ"
             ],
             "التين" : [
              " وَالتِّينِ وَالزَّيْتُونِ", "َوطُورِ سِينِينَ", "وَهَـٰذَا الْبَلَدِ الْأَمِينِ","لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ","ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ", "إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ" ,"َألَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ"
              ],
           "العلق":  [
               "۩ اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ", "َخَلَقَ الْإِنسَانَ مِنْ عَلَقٍ", "اقْرَأْ وَرَبُّكَ الْأَكْرَمُ","الَّذِي عَلَّمَ بِالْقَلَمِ","عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ", "َكلَّا إِنَّ الْإِنسَانَ لَيَطْغَىٰ","أَن رَّآهُ اسْتَغْنَىٰ","ِِ أنَّ إِلَىٰ رَبِّكَ الرُّجْعَىٰ","َأَرَأَيْتَ الَّذِي يَنْهَىٰ","عَبْدًا إِذَا صَلَّىٰ","أَرَأَيْتَ إِن كَانَ عَلَى الْهُدَىٰ","أَوْ أَمَرَ بِالتَّقْوَىٰ",  "أَرَأَيْتَ إِن كَذَّبَ وَتَوَلَّىٰ"," أَلَمْ يَعْلَم بِأَنَّ اللَّهَ يَرَىٰ","كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًا بِالنَّاصِيَةِ","نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ","فَلْيَدْعُ نَادِيَهُ","سَنَدْعُ الزَّبَانِيَةَ","كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِب"
           ],                     
            "القدر": [
                 "إِنَّا أَنزلْنَاهُ فِي لَيْلَةِ الْقَدْرِ", "وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ", "لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ", "تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ", "سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ"
             ],  
             "البينة": [
                 "لَمْ يَكُنِ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ الْبَيِّنَةُ", "رَسُولٌ مِّنَ اللَّهِ يَتْلُو صُحُفًا مُّطَهَّرَةً","فِيهَا كُتُبٌ قَيِّمَةٌ", "وَمَا تَفَرَّقَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِن بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَةُ","وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ ۚ وَذَٰلِكَ دِينُ الْقَيِّمَةِ","إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا ۚ أُولَـٰئِكَ هُمْ شَرُّ الْبَرِيَّةِ", "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَـٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ","جَزَاؤُهُمْ عِندَ رَبِّهِمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۖ رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ ۚ ذَٰلِكَ لِمَنْ خَشِيَ رَبَّهُ"
             ],
            "الزلزلة": [
                "إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا","وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا","وَقَالَ الْإِنسَانُ مَا لَهَا","يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ"," فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ","وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ"
            ],
            "العاديات": [
                " وَالْعَادِيَاتِ ضَبْحًا","فَالْمُورِيَاتِ قَدْحًا","فَالْمُغِيرَاتِ صُبْحًا","فَأَثَرْنَ بِهِ نَقْعًا","فَوَسَطْنَ بِهِ جَمْعًا","إِنَّ الْإِنسَانَ لِرَبِّهِ لَكَنُودٌ","وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ","وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ","أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ","وَحُصِّلَ مَا فِي الصُّدُورِ","إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ"

        function loadLocalSurah(surahName) {
            const container = document.getElementById("quranContainer");
            const verses = quranDatabase[surahName];
            if (!verses) return;
            let htmlOutput = '<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>';
            verses.forEach((verseText, index) => {
                htmlOutput += `<span class="ayah" onclick="toggleAyah(this)">${verseText}</span>`;
                htmlOutput += `<span class="ayah-number">﴿${index + 1}﴾</span> `;
            });
            container.innerHTML = htmlOutput;
            document.getElementById("currentSurahName").textContent = `سورة ${surahName}`;
            updateNavButtons();
        }
        function navigateSurah(direction) {
            const select = document.getElementById("surahSelect");
            let newIndex = select.selectedIndex + direction;
            if (newIndex >= 0 && newIndex < select.options.length) {
                select.selectedIndex = newIndex;
                loadLocalSurah(select.value);
            }
        }
        function updateNavButtons() {
            const select = document.getElementById("surahSelect");
            const currentIndex = select.selectedIndex;
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const bottomPrevBtn = document.getElementById("bottomPrevBtn");
            const bottomNextBtn = document.getElementById("bottomNextBtn");
            
            if (currentIndex > 0) {
                prevBtn.disabled = false; bottomPrevBtn.disabled = false;
                const prevName = select.options[currentIndex - 1].text;
                prevBtn.innerHTML = `◀ ${prevName}`; bottomPrevBtn.innerHTML = `◀ ${prevName}`;
            } else {
                prevBtn.disabled = true; bottomPrevBtn.disabled = true;
                prevBtn.innerHTML = "السابق ◀"; bottomPrevBtn.innerHTML = "السابق ◀";
            }
            if (currentIndex < select.options.length - 1 && currentIndex !== -1) {
                nextBtn.disabled = false; bottomNextBtn.disabled = false;
                const nextName = select.options[currentIndex + 1].text;
                nextBtn.innerHTML = `${nextName} ▶`; bottomNextBtn.innerHTML = `${nextName} ▶`;
            } else {
                nextBtn.disabled = true; bottomNextBtn.disabled = true;
                nextBtn.innerHTML = "▶ التالي"; bottomNextBtn.innerHTML = "▶ التالي";
            }
        }
          // 5. كود تشغيل الوضع الليلي
 function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme"); const toggleBtn = document.querySelector(".theme-toggle-btn");
            if (currentTheme === "dark") { document.documentElement.removeAttribute("data-theme"); toggleBtn.innerHTML = "🌙 الوضع الليلي"; }
            else { document.documentElement.setAttribute("data-theme", "dark"); toggleBtn.innerHTML = "☀️ الوضع النهاري"; }
        }
        document.addEventListener("DOMContentLoaded", () => {
            loadLocalSurah("النبأ");
        });
        function toggleAyah(ayahElement) { ayahElement.classList.toggle('revealed'); }
        function revealAll() { document.querySelectorAll('.ayah').forEach(ayah => ayah.classList.add('revealed')); }
        function hideAll() { document.querySelectorAll('.ayah').forEach(ayah => ayah.classList.remove('revealed')); }
